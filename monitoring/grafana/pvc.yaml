# Grafana's own database (users, preferences, dashboards edited in the UI).
# Provisioned dashboards come from the ConfigMaps and need no volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
