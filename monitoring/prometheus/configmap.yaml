apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    # k6 results arrive by remote write (k6 -o experimental-prometheus-rw), not by
    # scraping. See docs/notes/monitoring.md.

    scrape_configs:
      # Only one environment runs at a time; the other target simply shows "down".
      - job_name: "fastapi"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "fastapi-service.llm-baseline.svc.cluster.local:8010"
            labels:
              env: baseline
          - targets:
              - "fastapi-service.llm-secure.svc.cluster.local:8010"
            labels:
              env: secure

      # Container CPU, CPU throttling and memory from the kubelet (cAdvisor) of
      # every node, read through the API server proxy.
      - job_name: "cadvisor"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # Keep only what the dashboards and the thesis use.
          - source_labels: [__name__]
            regex: container_cpu_(usage_seconds|cfs_(throttled_)?periods)_total|container_memory_working_set_bytes
            action: keep
          - source_labels: [namespace]
            regex: llm-.*|traefik|linkerd|monitoring
            action: keep
