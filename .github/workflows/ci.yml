name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.12.7
      - name: Run ruff
        run: ruff check apps

  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [llm-api, llm-gateway]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  validate:
    name: Validate YAML and manifests
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install yamllint==1.37.1
      - name: Install kubeconform (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSfLO "${url}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run yamllint
        run: yamllint .
      - name: Create throwaway secrets (validation only, never deployed)
        run: |
          cp kubernetes/components/gateway/gateway.env.example kubernetes/components/gateway/gateway.env
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci.invalid" \
            -keyout kubernetes/components/ingress-tls/tls.key \
            -out kubernetes/components/ingress-tls/tls.crt
      - name: Validate Kustomize overlays
        run: |
          for overlay in kubernetes/overlays/*/; do
            echo "== ${overlay}"
            kubectl kustomize "${overlay}" | kubeconform -strict -summary
          done
      - name: Validate monitoring manifests
        run: kubeconform -strict -summary monitoring/

  build:
    name: Build image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: llm-api
            port: 8000
            health: /health
          - app: llm-gateway
            port: 8080
            health: /_gateway/health
    env:
      IMAGE: ${{ matrix.app }}:ci
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t "${IMAGE}" "apps/${{ matrix.app }}"
      - name: Check the container does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id "${IMAGE}" -u)"
          echo "Container user id: ${uid}"
          test "${uid}" != "0"
      - name: Smoke test (start container, call health endpoint)
        run: |
          docker run -d --name smoke -p "9000:${{ matrix.port }}" \
            -e API_KEY=ci-only-dummy-key-0123456789 "${IMAGE}"
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:9000${{ matrix.health }}"; then
              echo
              echo "Healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy. Logs:"
          docker logs smoke
          exit 1
