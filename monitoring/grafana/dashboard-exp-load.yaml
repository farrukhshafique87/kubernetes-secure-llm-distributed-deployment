# yamllint disable rule:line-length
# (the JSON contains PromQL and descriptions that cannot be wrapped)
# Dashboard provisioned into Grafana (folder "Thesis"). Edit the JSON here,
# not in the Grafana UI: provisioned dashboards are read-only there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  exp-load.json: |
    {
      "uid": "exp-load",
      "title": "Load runs: k6 and containers",
      "description": "Live view of k6 load runs (remote write) and container CPU, throttling and memory.",
      "tags": [
        "thesis",
        "k6",
        "exp-02"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 2,
      "editable": false,
      "refresh": "5s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "testid",
            "label": "Run",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(k6_http_reqs_total, testid)",
              "refId": "testid"
            },
            "definition": "label_values(k6_http_reqs_total, testid)",
            "refresh": 2,
            "sort": 2,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(container_cpu_usage_seconds_total, namespace)",
              "refId": "namespace"
            },
            "definition": "label_values(container_cpu_usage_seconds_total, namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "k6 (live, pushed by the load generator)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Achieved request rate",
          "description": "Requests per second completed by k6. Below the target rate means the system no longer keeps up.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (testid) (rate(k6_http_reqs_total{testid=~\"$testid\"}[$__rate_interval]))",
              "legendFormat": "{{testid}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Dropped iterations",
          "description": "Requests k6 could not start because all VUs were waiting. Above zero: the run is saturated.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (testid) (rate(k6_dropped_iterations_total{testid=~\"$testid\"}[$__rate_interval]))",
              "legendFormat": "{{testid}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Request latency (avg and p95)",
          "description": "k6 trend statistics per push interval (5 s), in seconds.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (testid) ({__name__=~\"k6_http_req_duration_avg(_seconds)?\", testid=~\"$testid\"})",
              "legendFormat": "avg {{testid}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (testid) ({__name__=~\"k6_http_req_duration_p95(_seconds)?\", testid=~\"$testid\"})",
              "legendFormat": "p95 {{testid}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Failed requests",
          "description": "Share of requests that failed (non-2xx, timeout or connection error).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 6,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (testid) (k6_http_req_failed_rate{testid=~\"$testid\"})",
              "legendFormat": "{{testid}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Active VUs",
          "description": "Virtual users busy at the same time. Reaching MAX_VUS means requests are queuing.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 9,
            "w": 6,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (testid) (k6_vus{testid=~\"$testid\"})",
              "legendFormat": "{{testid}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Containers (kubelet cAdvisor)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU per container",
          "description": "Millicores, 1-minute average (the kubelet updates these counters every 10-15 s). Compare with the CPU limit of the container (gateway 500 m, fastapi 1000 m).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[1m])) * 1000",
              "legendFormat": "{{namespace}}/{{pod}}/{{container}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "CPU throttling",
          "description": "1-minute average share of CFS periods in which the container was throttled because it reached its CPU limit.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never"
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[1m])) / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[1m]))",
              "legendFormat": "{{namespace}}/{{pod}}/{{container}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Memory working set",
          "description": "Memory in use per container.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~\"$namespace\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "{{namespace}}/{{pod}}/{{container}}"
            }
          ]
        }
      ]
    }
