# EXP-04: c5-gateway with the gateway CPU limit raised from 500 m to 1000 m.
# Everything else, including the namespace and the entry on localhost:8010,
# is taken unchanged from kind-c5-gateway.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../kind-c5-gateway

patches:
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
